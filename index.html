<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пошук репозиторіїв GitHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-card { max-width: 950px; margin: 40px auto; border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .gh-logo { color: #0969da; font-weight: 800; letter-spacing: -0.5px; }
        .btn-gh { background-color: #2da44e; color: white; font-weight: 600; border: none; }
        .btn-gh:hover { background-color: #2c974b; color: white; }
        .badge-gh { background-color: #0969da; color: white; font-size: 0.85rem; }
        .scroll-container { max-height: 480px; overflow-y: auto; }
        .repo-item { cursor: pointer; transition: background-color 0.15s ease-in-out; }
        .repo-item:hover { background-color: #f0f3f6; }
        .repo-item.active { background-color: #0969da !important; color: white !important; }
        .repo-item.active .badge-gh { background-color: white !important; color: #0969da !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="card main-card p-4">
        <h2 class="text-center mb-4"><span class="gh-logo">GitHub</span> — Пошук репозиторіїв</h2>
        
        <!-- Форма пошуку -->
        <div class="row g-3 align-items-end mb-3">
            <div class="col-md-9">
                <label for="usernameInput" class="form-label fw-bold">Введіть нікнейм користувача GitHub:</label>
                <input type="text" class="form-control form-control-lg" id="usernameInput" placeholder="Наприклад: octocat, torvalds...">
            </div>
            <div class="col-md-3">
                <button type="button" class="btn btn-gh btn-lg w-100" id="searchBtn">Знайти</button>
            </div>
        </div>

        <!-- Поле для токена (якщо перевищено ліміт) -->
        <div class="mb-4">
            <input type="password" class="form-control form-control-sm text-muted" id="tokenInput" placeholder="GitHub Personal Access Token (опціонально, для розширення ліміту запитів)">
        </div>

        <!-- Лоадер -->
        <div class="text-center d-none my-5" id="loader">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Завантаження...</span>
            </div>
            <p class="mt-3 text-muted fw-medium">Запит до GitHub API...</p>
        </div>

        <!-- Блок помилки -->
        <div id="errorAlert" class="alert alert-danger d-none mt-3" role="alert"></div>

        <!-- Блок результатів -->
        <div id="resultsBlock" class="d-none">
            <hr class="my-4">
            <div class="row g-4">
                
                <!-- Ліва колонка: Список репозиторіїв -->
                <div class="col-md-5">
                    <h5 class="mb-3 text-secondary" id="reposTitle">Репозиторії:</h5>
                    <div class="list-group scroll-container border rounded" id="repoList">
                        <!-- Сюди рендериться список -->
                    </div>
                </div>

                <!-- Права колонка: Інформація про обраний репозиторій -->
                <div class="col-md-7">
                    <h5 class="mb-3 text-secondary">Деталі репозиторію:</h5>
                    
                    <div id="detailsPlaceholder" class="p-4 text-center text-muted border rounded bg-light">
                        Оберіть репозиторій зі списку ліворуч для перегляду деталей.
                    </div>

                    <div id="repoDetails" class="card d-none border shadow-sm">
                        <div class="card-body">
                            <h4 class="card-title text-primary fw-bold mb-2" id="detailName">---</h4>
                            <p class="card-text text-muted mb-3" id="detailDescription">---</p>
                            
                            <ul class="list-group list-group-flush mb-3">
                                <li class="list-group-item px-0"><strong>URL:</strong> <a id="detailUrl" href="#" target="_blank" class="text-decoration-none">Переглянути на GitHub ↗</a></li>
                                <li class="list-group-item px-0"><strong>Створено:</strong> <span id="detailCreated">---</span></li>
                                <li class="list-group-item px-0"><strong>Останнє оновлення:</strong> <span id="detailUpdated">---</span></li>
                                <li class="list-group-item px-0">
                                    <strong>Мови розробки:</strong>
                                    <div id="detailLanguages" class="mt-1">---</div>
                                </li>
                            </ul>

                            <h6 class="fw-bold mt-4 mb-2">Останні коміти:</h6>
                            <div class="scroll-container border rounded p-2 bg-light" style="max-height: 200px;">
                                <ul class="list-group list-group-flush small" id="detailCommits">
                                    <!-- Сюди рендеряться коміти -->
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
